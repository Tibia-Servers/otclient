name: Compilar OTClient 32 bits (x86)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-x86:
    name: Windows x86 (32 bits)
    runs-on: windows-2025-vs2026
    timeout-minutes: 180
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkgcache,readwrite"
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v6

      - name: Leer version de vcpkg
        shell: pwsh
        run: |
          $json = Get-Content vcpkg.json -Raw | ConvertFrom-Json
          "VCPKG_GIT_COMMIT_ID=$($json.'builtin-baseline')" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Cache de librerias
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkgcache
          key: vcpkg-x86-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-x86-

      - name: Preparar compilador de 32 bits
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Preparar vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitURL: "https://github.com/microsoft/vcpkg.git"
          vcpkgGitCommitId: ${{ env.VCPKG_GIT_COMMIT_ID }}

      - name: Configurar (32 bits)
        shell: pwsh
        run: |
          cmake -S . -B build/x86 -G Ninja `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x86-windows-static-release `
            -DVCPKG_HOST_TRIPLET=x64-windows `
            -DVCPKG_OVERLAY_TRIPLETS="${{ github.workspace }}/cmake/triplets" `
            -DVCPKG_BUILD_TYPE=release `
            "-DVCPKG_INSTALL_OPTIONS=--clean-packages-after-build;--clean-buildtrees-after-build" `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_STATIC_LIBRARY=ON `
            -DCMAKE_C_COMPILER=cl.exe `
            -DCMAKE_CXX_COMPILER=cl.exe `
            -DTOGGLE_BIN_FOLDER=ON `
            -DOPTIONS_ENABLE_IPO=OFF `
            -DOTCLIENT_BUILD_TESTS=OFF `
            -DSPEED_UP_BUILD_UNITY=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Arreglar conflicto ssize_t (32 bits)
        shell: pwsh
        run: |
          $inc = Get-ChildItem build/x86 -Recurse -Filter httplib.h -ErrorAction SilentlyContinue
          if (-not $inc) { Write-Host "AVISO: no se encontro httplib.h" }
          foreach ($f in $inc) {
            Write-Host "== $($f.FullName)"
            $text = [System.IO.File]::ReadAllText($f.FullName)
            # cualquier definicion de ssize_t (using ... = tipo;  o  typedef tipo ssize_t;)
            $n1 = [regex]::Matches($text, 'using\s+ssize_t\s*=\s*[^;]+;').Count
            $n2 = [regex]::Matches($text, 'typedef\s+[^;\r\n]*\bssize_t\s*;').Count
            Write-Host "Definiciones encontradas: using=$n1 typedef=$n2"
            $text = [regex]::Replace($text, 'using\s+ssize_t\s*=\s*[^;]+;', 'using ssize_t = long;')
            $text = [regex]::Replace($text, 'typedef\s+[^;\r\n]*\bssize_t\s*;', 'typedef long ssize_t;')
            [System.IO.File]::WriteAllText($f.FullName, $text)
            Select-String -Path $f.FullName -Pattern 'ssize_t' | Select-Object -First 12 | ForEach-Object { Write-Host ("L{0}: {1}" -f $_.LineNumber, $_.Line) }
          }
          Write-Host "== Otras definiciones de ssize_t en librerias:"
          Get-ChildItem build/x86/vcpkg_installed -Recurse -Include *.h,*.hpp -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -ne 'httplib.h' } |
            Select-String -Pattern '(typedef\s+[^;]*\bssize_t\s*;|using\s+ssize_t\s*=)' -ErrorAction SilentlyContinue |
            Select-Object -First 10 | ForEach-Object { Write-Host ("{0}:{1}: {2}" -f $_.Path, $_.LineNumber, $_.Line) }

      - name: Compilar
        shell: pwsh
        run: |
          cmake --build build/x86
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Reunir resultado
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Get-ChildItem build/x86 -Recurse -Include *.exe,*.dll -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch 'vcpkg_installed|CMakeFiles|_deps|vcpkg_' } |
            ForEach-Object { Copy-Item $_.FullName out/ -Force; Write-Host "Copiado: $($_.Name)" }
          if (-not (Get-ChildItem out -Filter *.exe)) { throw "No se genero ningun .exe" }

      - name: Subir resultado
        uses: actions/upload-artifact@v4
        with:
          name: otclient-windows-x86-32bits
          path: out/

